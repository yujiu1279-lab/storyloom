<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Storyloom</title>
<style>
:root{--bg:#0d0f14;--panel:#171a22;--panel2:#202431;--line:#303746;--text:#f6f7fb;--muted:#a8afbd;--p1:#9b8cff;--p2:#ff9bc8;--good:#79d7a6;--warn:#f2c675;--bad:#ee8f9b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0f14,#141824 55%,#0d0f14);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}.wrap{max-width:820px;margin:auto;padding:18px 14px 60px}
.hero{padding:22px 18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(155,140,255,.18),rgba(255,155,200,.09))}
.brand{font-size:30px;font-weight:900;letter-spacing:.01em}.tagline{margin-top:7px;color:#d0d5df;font-size:14px;line-height:1.7}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.tab{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-weight:750}.tab.active{background:linear-gradient(135deg,rgba(155,140,255,.25),rgba(255,155,200,.15));border-color:#6f6899}
.panel{margin-top:13px;background:rgba(23,26,34,.96);border:1px solid var(--line);border-radius:19px;padding:15px}.panel h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px;line-height:1.65}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text)}
.field textarea{min-height:86px;resize:vertical}.inline{display:flex;gap:8px}.inline input{flex:1}.mini{padding:0 13px;border-radius:12px;border:1px solid var(--line);background:#292e3b;color:var(--text);font-weight:700}
.big{width:100%;margin-top:12px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#111319;font-size:17px;font-weight:900}
.secondary{padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);font-weight:720}
details summary{cursor:pointer;font-weight:750}.settings{margin-top:12px;display:grid;gap:11px}
.card{margin-top:10px;padding:15px;border:1px solid var(--line);border-radius:17px;background:#12151c}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.role{font-size:12px;color:var(--p1);font-weight:800}.name{font-size:22px;font-weight:900;margin-top:3px}
.badges span{display:inline-block;padding:5px 8px;border-radius:999px;background:#272c39;color:#dce0e8;font-size:12px;margin:5px 3px 0 0}.prose{font-size:14px;line-height:1.85;color:#e7e9ef;white-space:pre-wrap}
.sectionTitle{font-size:13px;color:#c2c7d1;font-weight:800;margin-bottom:8px}.event{padding:13px;border-left:3px solid var(--p2);background:#1c202a;border-radius:11px}.chapter{padding:15px;background:#11141b;border-radius:15px;border:1px solid #282e3b}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.lock.on{border-color:var(--p2);color:#ffd9e9}.hidden{display:none!important}
.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rate{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}.rate.on.good{border-color:var(--good)}.rate.on.mid{border-color:var(--warn)}.rate.on.bad{border-color:var(--bad)}
.sceneChips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:9px 11px;border-radius:999px;border:1px solid var(--line);background:#242936;color:#eef0f5;font-size:13px}
.timelineItem{padding:11px 0;border-top:1px dashed var(--line)}.timelineItem:first-child{border-top:0}
.libItem{padding:13px;border:1px solid var(--line);border-radius:14px;background:#12151c;margin-top:9px}.libTop{display:flex;justify-content:space-between;gap:8px}.libName{font-weight:850}.libMeta{font-size:12px;color:var(--muted);margin-top:4px}.empty{text-align:center;padding:25px;color:var(--muted)}
.rangeRow{display:flex;align-items:center;gap:10px}.rangeRow input{flex:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#262b38;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:13px;display:none;z-index:20}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="brand">Storyloom</div>
<div class="tagline">把人物、关系和你突然想看的那一幕织出来。先满足当下的兴趣，喜欢了再慢慢长成一整个故事。</div>
</section>

<div class="tabs">
<button class="tab active" id="tabCreate">🪡 捏一个故事</button>
<button class="tab" id="tabLibrary">📚 我的故事库</button>
</div>

<div id="createView">
<section class="panel">
<details open>
<summary>⚙️ 今天想捏什么</summary>
<div class="settings">
<div class="grid2">
<div class="field">
<label>题材</label>
<select id="genre"></select>
</div>
<div class="field">
<label>关系模式</label>
<select id="mode">
<option value="1v1">1v1</option>
<option value="multiA">1受 × 多攻</option>
<option value="multiR">1攻 × 多受</option>
</select>
</div>
</div>

<div class="grid2">
<div class="field">
<label>自定义题材（输入一次后会保存进题材列表）</label>
<div class="inline"><input id="customGenre" placeholder="例如：香港豪门 / 电竞 / 刑侦"><button class="mini" id="saveGenre">保存</button></div>
</div>
<div class="field" id="countField">
<label>多人模式人数</label>
<select id="multiCount"><option value="2">2个</option><option value="3" selected>3个</option><option value="4">4个</option></select>
</div>
</div>

<div class="grid2">
<div class="field"><label>攻人设（可留空随机）</label><input id="atkPersona" list="atkList" placeholder="例如：年上控场、疯批但克制、阳光腹黑"><datalist id="atkList"></datalist></div>
<div class="field"><label>受人设（可留空随机）</label><input id="recPersona" list="recList" placeholder="例如：冷淡嘴硬、漂亮但不好惹、钝感强"><datalist id="recList"></datalist></div>
</div>

<div class="grid2">
<div class="field">
<label>年龄差</label>
<select id="ageGap">
<option>随机</option><option>同龄 / ±1</option><option>攻年上 2–5 岁</option><option>攻年上 6–10 岁</option><option>受年上 2–5 岁</option>
</select>
</div>
<div class="field">
<label>关系气质</label>
<select id="heat"><option>随机</option><option>慢热暗流</option><option>高张力</option><option>危险拉扯</option><option>势均力敌</option><option>轻松暧昧</option></select>
</div>
</div>

<div class="field">
<label>惊喜度：<span id="surpriseText">60</span>%</label>
<div class="rangeRow"><span class="muted">熟悉口味</span><input type="range" id="surprise" min="0" max="100" value="60"><span class="muted">给我惊喜</span></div>
</div>
</div>
</details>
<button class="big" id="generate">✨ 给我一个故事</button>
</section>

<section id="result" class="hidden">
<div class="panel">
<div class="sectionTitle">人物</div>
<div id="characters"></div>
<div class="actions">
<button class="secondary" id="rerollUnlocked">🎲 只重抽没锁的人</button>
<button class="secondary" id="rerollRelation">🔀 人物不动，只换相识</button>
</div>
</div>

<div class="panel">
<div class="sectionTitle">他们怎么认识，又为什么会继续见面</div>
<div class="event prose" id="eventText"></div>
</div>

<div class="panel">
<div class="sectionTitle">第一章</div>
<div class="chapter prose" id="chapterText"></div>
<div class="actions">
<button class="secondary" id="rewriteChapter">✍️ 换一种第一章写法</button>
<button class="secondary" id="copyStory">📋 复制整组设定</button>
</div>
</div>

<div class="panel">
<div class="sectionTitle">这组你吃不吃？</div>
<div class="rating">
<button class="rate good" data-rating="满意">😍 满意</button>
<button class="rate mid" data-rating="一般">😐 一般</button>
<button class="rate bad" data-rating="不满意">😖 不满意</button>
</div>
<div class="field" style="margin-top:10px"><textarea id="feedback" placeholder="随便说一句：哪个人设香、哪里俗、名字不喜欢、相识方式很好……"></textarea></div>
<div class="actions">
<button class="secondary" id="saveFeedback">保存评价</button>
<button class="secondary" id="favorite">♡ 收藏这组</button>
</div>
<div class="muted" id="learnTip" style="margin-top:9px">你的评价会保存在这台设备里；随机生成时会轻微参考你满意过的题材。文字意见可以之后一键整理给 ChatGPT。</div>
</div>

<div class="panel">
<div class="sectionTitle">名场面点播机</div>
<div class="sceneChips" id="sceneChips"></div>
<div class="field" style="margin-top:10px"><div class="inline"><input id="customScene" placeholder="或者自己写：雨夜去接他 / 前任出现 / 同学聚会"><button class="mini" id="makeCustomScene">写这一幕</button></div></div>
<div id="sceneOutput" class="hidden" style="margin-top:11px">
<div class="chapter prose" id="sceneText"></div>
<div class="actions"><button class="secondary" id="addTimeline">📌 加入时间线</button><button class="secondary" id="copyScene">📋 复制这一幕</button></div>
</div>
</div>

<div class="panel">
<div class="sectionTitle">这对 / 这群人的时间线</div>
<div id="timeline"></div>
</div>
</section>
</div>

<div id="libraryView" class="hidden">
<section class="panel">
<div class="sectionTitle">我的故事库</div>
<div class="actions">
<button class="secondary" id="showFav">❤️ 只看收藏</button>
<button class="secondary" id="exportFeedback">📦 复制近期反馈给 ChatGPT</button>
</div>
<div id="libraryList"></div>
</section>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const BASE_GENRES=["随机","大学校园","都市职场","高干 / 家族","悬疑危险","娱乐圈","电竞","刑侦","竹马 / 发小","破镜重圆开局","古代架空","轻幻想"];
const GENRE_DATA={
"大学校园":{ids:["法学院学生","建筑系学生","医学院学生","新闻系学生","计算机系学生","校辩论队主力","研究生助教","学生会干部"],events:["酒吧后门替室友取落下的手机","校辩论赛临时换队友","暴雨封校时借同一把伞","凌晨自习室因为一台充电器起争执","社团活动结束后被反锁在礼堂后台"]},
"都市职场":{ids:["青年律师","记者","品牌策划","投行分析师","建筑师","纪录片摄影师","创业公司合伙人","游戏主策"],events:["客户临时爽约后在酒店酒吧拼桌","同一场发布会上拿错了工作证","凌晨加班时遇到整栋楼停电","航班延误被安排到同一辆接驳车","替共同朋友处理一次突发事故"]},
"高干 / 家族":{ids:["家族企业继承人","私人基金经理","青年律师","建筑事务所合伙人","艺术基金会负责人","创业公司创始人","政商家庭二代","品牌主理人"],events:["一场长辈安排的饭局临时换了座位","慈善晚宴后台误拿了对方的外套","替家里处理同一桩旧宅产权纠纷","朋友婚礼上被迫坐同一桌","在私人会所替共同朋友解围"]},
"悬疑危险":{ids:["调查记者","法医助理","私人调查员","安保顾问","刑侦顾问","律师","纪录片摄影师","酒吧老板"],events:["酒吧后巷撞见一场冲突","凌晨去医院认领同一个伤者","拿错了装着关键资料的文件袋","一场采访结束后发现车被人动过","共同朋友失联后各自收到同一条短信"]},
"娱乐圈":{ids:["新锐演员","经纪人","编剧","摄影师","唱作人","制片人","舞台导演","时尚编辑"],events:["颁奖礼后台临时共用一间休息室","拍摄现场因为替身缺席被迫搭戏","红毯前十分钟发现拿错了造型箱","深夜收工后在便利店认出对方","朋友的庆功宴上替对方挡了一杯酒"]},
"电竞":{ids:["职业选手","战队数据分析师","教练","赛事解说","游戏主播","俱乐部经理","青训选手","游戏策划"],events:["排位赛里吵了一整局才发现坐在隔壁","线下赛后台拿错了外设包","临时缺人被拉进同一支表演赛队伍","凌晨训练室只剩他们两个人","直播事故后被迫一起做澄清"]},
"刑侦":{ids:["刑警","法医","律师","记者","心理顾问","技侦人员","检察官助理","私人调查员"],events:["同一案件现场第一次碰面就意见不合","凌晨审讯结束后一起被困在停车场","因为一份错误送达的卷宗产生联系","医院走廊里同时等一名关键证人醒来","追同一条线索时在旧城区撞见"]},
"竹马 / 发小":{ids:["研究生","青年律师","医生","建筑师","创业者","摄影师","教师","自由职业者"],events:["多年后回老家参加同一个人的婚礼","帮父母搬家时翻出一盒旧照片","春节被两家长辈安排一起去买东西","其中一人临时借住进另一人的空房","高中同学群突然有人发出他们旧照"]},
"破镜重圆开局":{ids:["青年律师","医生","演员","记者","建筑师","创业者","摄影师","大学教师"],events:["分开三年后在共同朋友婚礼重逢","租房合同出了问题才发现房东是前任","公司并购项目的对方负责人是旧爱","急诊室里认出陪病人来的那个人","机场广播延误后在同一排座位坐下"]},
"古代架空":{ids:["世家公子","年轻将领","太医","御史","商行少东家","书院先生","暗卫统领","画师"],events:["上元灯会误拿了同一盏灯","雨夜避进同一间废寺","替朋友送信却送到了对方手里","宴席散后在宫门外共等一辆马车","一桩旧案让两家的人被迫同行"]},
"轻幻想":{ids:["异能研究员","城市异常调查员","梦境记录师","特殊事务律师","古籍修复师","灵感摄影师","研究所观察员","秘密组织联络人"],events:["同一天重复做了同一个梦","在只有他们能看见的地铁站相遇","一件旧物同时出现在两个人家里","为了处理同一场异常被临时绑定","其中一人突然开始听见另一个人的梦话"]}
};
const RANDOM_IDS=["律师","医生","摄影师","记者","研究生","建筑师","音乐人","策展人","创业者","教师","设计师","酒吧老板"];
const ATK_TRAITS=["控场感强","情绪稳定","锋利直接","表面温和但主意很正","行动力强","看着散漫其实很有秩序","很少示弱","会照顾场面但不爱解释自己"];
const REC_TRAITS=["冷淡但有自己的执拗","反应快、嘴很利","看起来好说话其实边界很重","情绪不外露","敏感但不轻易示弱","很会观察人","有点阴郁但判断清醒","懒得社交却很会看穿别人"];
const FAMILIES=["父母常年异地工作，从高中起就习惯自己处理生活","家里关系不错，但人人都忙，很少认真聊彼此的事","父母早年分开，他跟其中一方联系很淡","家里做生意，物质宽裕，很多决定却从小被安排","普通工薪家庭，父母对他要求不高，他反而对自己要求很高","跟外婆长大，成年后才重新和父母住近","家里兄弟姐妹多，他很早就学会不抢话也不示弱","独生子，家里很安静，习惯把自己的事自己消化"];
const HABITS=["手机常年静音，重要的人会单独设提醒","不爱吃早餐，但会记得别人喝什么咖啡","桌面看着乱，任何东西的位置他都记得","生气时反而说话更慢","习惯提前十分钟到，最讨厌别人临时改计划","喝酒不上脸，越喝越安静","记人靠细节，第二次见面就会记得对方上次穿什么","不喜欢发语音，除非真的懒得打字"];
const FLAWS=["记仇，而且记得很久","遇到真正重要的事反而不愿意开口","控制欲比自己承认的更强","太相信自己的判断，很难被劝","不擅长求助，宁愿把事情拖到很糟","嘴硬，知道错了也不会第一时间道歉","对亲近的人要求反而更高","一旦觉得关系失控就会先撤"];
const SCENES=["第一次心动","吃醋","暧昧失控","第一次接吻","告白","确认关系","争吵","冷战","分手","久别重逢","破镜重圆","朋友面前露馅","生病瞒着对方","凌晨四点的一通电话","多年以后"];
const FIRST_LINES=[
"门被推开的时候，外面的雨声跟着灌进来。",
"凌晨一点十七分，手机第二次震动时，他才低头看了一眼。",
"那天原本没有任何值得记住的地方，直到有人叫错了他的名字。",
"所有人都散得差不多了，走廊尽头只剩一盏灯还亮着。",
"他后来想过很多次，如果那晚早五分钟离开，事情大概会完全不同。"
];

const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const toast=t=>{const x=$("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1700)};

let current=null, selectedRating="", currentScene="", locked=new Set();

function allGenres(){return [...BASE_GENRES.filter(x=>x!=="随机"),...load("storyloomCustomGenres",[])];}
function renderGenreOptions(){
 const prev=$("genre").value;
 $("genre").innerHTML='<option>随机</option>'+allGenres().map(x=>'<option>'+escapeHtml(x)+'</option>').join("");
 if([...$("genre").options].some(o=>o.value===prev))$("genre").value=prev;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function updateModeUI(){$("countField").style.display=$("mode").value==="1v1"?"none":"block";}
function rememberPersona(){
 const a=$("atkPersona").value.trim(),r=$("recPersona").value.trim();
 if(a){let x=load("storyloomAtk",[]);if(!x.includes(a)){x.unshift(a);save("storyloomAtk",x.slice(0,12));}}
 if(r){let x=load("storyloomRec",[]);if(!x.includes(r)){x.unshift(r);save("storyloomRec",x.slice(0,12));}}
 renderDatalists();
}
function renderDatalists(){
 $("atkList").innerHTML=load("storyloomAtk",[]).map(x=>'<option value="'+escapeHtml(x)+'">').join("");
 $("recList").innerHTML=load("storyloomRec",[]).map(x=>'<option value="'+escapeHtml(x)+'">').join("");
}
function learnedGenre(){
 const stories=load("storyloomStories",[]);
 const good=stories.filter(s=>s.rating==="满意"&&s.genre&&s.genre!=="随机");
 if(!good.length)return null;
 const counts={};good.forEach(s=>counts[s.genre]=(counts[s.genre]||0)+1);
 const weighted=[];Object.keys(counts).forEach(k=>{for(let i=0;i<counts[k];i++)weighted.push(k)});
 return pick(weighted);
}
function chosenGenre(){
 const g=$("genre").value;
 if(g!=="随机")return g;
 const surprise=+$("surprise").value;
 if(Math.random()*100>surprise){const lg=learnedGenre();if(lg)return lg;}
 return pick(allGenres());
}
function dataForGenre(g){
 if(GENRE_DATA[g])return GENRE_DATA[g];
 return {ids:RANDOM_IDS,events:["朋友临时组的饭局上坐到了一起","深夜便利店因为最后一把伞说上话","共同朋友喝醉后把两个人同时叫来","机场延误时被安排在同一排座位","一场临时取消的活动让他们一起滞留"]};
}
function namePool(){
 const surn=["沈","裴","梁","周","贺","闻","程","谢","郁","季","陆","祁","温","许","江","顾","林","韩","陈","霍","宋","秦","纪","邵","唐","苏"];
 const given=["既明","予安","庭川","行舟","知遥","景澄","惟深","照临","柏言","明彻","序白","砚川","越衡","怀序","迟野","临川","闻洲","景行","言川","叙白","松隐","时屿","承砚","昭野","泊川","谨言"];
 return pick(surn)+pick(given);
}
function usedNames(){return load("storyloomStories",[]).flatMap(s=>(s.people||[]).map(p=>p.name)).slice(0,120);}
function uniqueName(){
 const u=usedNames();for(let i=0;i<80;i++){const n=namePool();if(!u.includes(n))return n}return namePool();
}
function rolePlan(){
 const mode=$("mode").value,count=+$("multiCount").value;
 if(mode==="1v1")return ["攻","受"];
 if(mode==="multiA")return ["受",...Array(count).fill("攻")];
 return ["攻",...Array(count).fill("受")];
}
function ageFor(role,index,base){
 const g=$("ageGap").value;
 if(g==="同龄 / ±1")return base+rand(-1,1);
 if(g==="攻年上 2–5 岁")return role==="攻"?base+rand(2,5):base;
 if(g==="攻年上 6–10 岁")return role==="攻"?base+rand(6,10):base;
 if(g==="受年上 2–5 岁")return role==="受"?base+rand(2,5):base;
 return Math.max(18,base+rand(-3,5)+(index?rand(-1,2):0));
}
function buildPerson(role,index,g,old){
 if(old)return old;
 const data=dataForGenre(g), custom=role==="攻"?$("atkPersona").value.trim():$("recPersona").value.trim();
 const trait=custom||pick(role==="攻"?ATK_TRAITS:REC_TRAITS);
 const age=ageFor(role,index,rand(20,25));
 return {id:uid(),role,name:uniqueName(),age,identity:pick(data.ids),trait,family:pick(FAMILIES),habit:pick(HABITS),flaw:pick(FLAWS)};
}
function profileText(p){
 return p.name+"，"+p.age+"岁，"+p.identity+"。"+p.family+"。平时"+p.habit+"。"+p.trait+"。真遇上自己在意的事时，"+p.flaw+"。";
}
function sceneKit(meeting,g){
 const s=meeting||"一次临时碰面";
 if(/酒吧|庆功宴|饭局|会所/.test(s))return {place:"靠近后门的窄走廊",prop:"一部落下的手机",sound:"门里低低的音乐声和玻璃杯碰在一起的响动",delay:"前台说失物登记的人还要十分钟才回来"};
 if(/婚礼|晚宴|颁奖|红毯/.test(s))return {place:"酒店宴会厅外的长廊",prop:"一张压在托盘下面的房卡套",sound:"宴会厅里断断续续的掌声",delay:"工作人员正在清场，他们暂时进不去"};
 if(/机场|航班|接驳/.test(s))return {place:"登机口最里面一排空座旁",prop:"一张被拿错的登机牌",sound:"广播反复播着延误通知",delay:"新的登机时间还没出来"};
 if(/医院|急诊|伤者|证人/.test(s))return {place:"急诊楼二层的自动贩卖机旁",prop:"一只装着检查单的牛皮纸袋",sound:"推床轮子碾过地砖的声音",delay:"护士让他们再等二十分钟"};
 if(/自习室|礼堂|辩论|封校|社团/.test(s))return {place:"教学楼侧门的屋檐下",prop:"一张临时门禁卡",sound:"雨点密密砸在金属遮雨棚上",delay:"值班老师去另一栋楼了，一时半会儿回不来"};
 if(/拍摄|替身|造型|收工|片场/.test(s))return {place:"摄影棚后面的化妆间门口",prop:"一页被折过角的剧本",sound:"场务在远处拖设备箱的轱辘声",delay:"下一场临时改景，所有人都被赶出来等"};
 if(/排位|线下赛|训练室|直播|外设/.test(s))return {place:"俱乐部训练室外的小休息区",prop:"一只贴错名字的外设包",sound:"隔音门里隐约传出的键盘声",delay:"管理员正在核对物品，他们只能等"};
 if(/案件|审讯|卷宗|线索|调查/.test(s))return {place:"停车场通往办公楼的安全通道",prop:"一个封口没贴牢的文件袋",sound:"楼上传来的脚步声和短促的电话铃",delay:"负责交接的人被临时叫走了"};
 if(/上元|废寺|送信|宫门|旧案/.test(s))return {place:"廊下避雨的石阶边",prop:"一封被雨气打潮的信",sound:"檐角水珠一串串落在青石上",delay:"前路封了，他们只能等雨势小些"};
 if(/梦|地铁|异常|旧物/.test(s))return {place:"末班地铁停运后的空站台",prop:"一张两个人手里都出现过的旧票",sound:"隧道深处很久才响一次的风声",delay:"出口的卷帘门莫名其妙落了下来"};
 return {place:"临街便利店外的塑料棚下",prop:"一把被拿错的黑伞",sound:"车轮压过积水的声音",delay:"共同朋友说至少还要二十分钟才到"};
}

function buildEvent(story){
 const meeting=story.meeting||pick(dataForGenre(story.genre).events), k=sceneKit(meeting,story.genre), ps=story.people;
 if(ps.length===2){
   const a=ps[0],b=ps[1];
   return "事情起在"+meeting+"。"+a.name+"赶到"+k.place+"时，"+b.name+"已经在那里了，手边正放着"+k.prop+"。"+
   a.name+"本来只打算把东西拿走，"+b.name+"却告诉他："+k.delay+"。两个人只好留下来等。"+
   "等人的二十来分钟里，他们先为"+k.prop+"到底是谁拿错的争了几句，后来又从共同认识的人聊到各自第二天的安排。"+
   "分别前，"+b.name+"把自己的号码输进"+a.name+"手机里，说等事情处理完记得发一声。第二天上午，"+a.name+"真的收到了他的第二条消息。";
 }
 const center=ps[0],others=ps.slice(1), names=others.map(x=>x.name);
 return "事情起在"+meeting+"。"+center.name+"到"+k.place+"的时候，"+names.join("、")+"已经先后到了。"+
 "几个人原本只是为了处理"+k.prop+"这件事，被"+k.delay+"硬生生留在原地。"+
 "等待期间有人打电话、有人去买水、有人把话题扯远，等负责的人回来时，他们已经把彼此的名字和联系方式都记住了。"+
 "第二天，这件小事又留下了一个没处理干净的尾巴，他们因此有了第二次见面的理由。";
}

function buildChapter(story,variant){

 const meeting=story.meeting||pick(dataForGenre(story.genre).events);

 const more=ps.filter(p=>p.id!==pov.id&&p.id!==other.id).map(p=>p.name);
 const alt=(variant||0)%3;

 const extra=more.length?"门外偶尔有人经过，其中还有"+more.join("、")+"，但没人进来。":"";
 return opener+"\n\n"+
 "“是这个？”"+pov.name+"朝"+k.prop+"抬了抬下巴。\n\n"+
 other.name+"把东西往他那边推了推。“你先别拿。刚才有人来问过，说登记还没做完。你现在带走，等会儿他们对不上记录，又得重新找人。”\n\n"+
 "“我只是来拿个东西，怎么还能赶上流程审批。”\n\n"+
 "“这已经是我替你问的第三个人了。”\n\n"+
 pov.name+"这才看他一眼。“我让你问了？”\n\n"+
 "“没有。”"+other.name+"把手机揣回去，“我站这儿闲着也是闲着。你要是不领情，就当我多管闲事。”\n\n"+
 "“你讲话一直这么客气？”\n\n"+
 "“看人。”\n\n"+
 "“那我待遇还挺特别。”\n\n"+
 "“你要这么理解，也行。”\n\n"+
 pov.name+"没接这句。他把外套拉链往上提了一点，转头看向另一边。"+k.delay+"。他本来还约了人吃宵夜，现在看来只能迟到。\n\n"+
 "手机震了一下。朋友问他到哪了。\n\n"+
 pov.name+"低头回消息：还没拿到，你们先吃。\n\n"+
 other.name+"扫见屏幕亮起，问：“有人等你？”\n\n"+
 "“嗯。”\n\n"+
 "“那你先走吧。我等登记的人回来，东西拿到以后让共同朋友转给你。”\n\n"+
 pov.name+"按灭手机。“你认识我朋友多久？”\n\n"+
 "“哪个？”\n\n"+
 "“叫你过来这个。”\n\n"+
 "“两年多。”"+other.name+"想了想，又补了一句，“不过他平时没这么会给人添麻烦。今天算超常发挥。”\n\n"+
 pov.name+"笑了一声。“那是因为你跟他不熟。”\n\n"+
 "“听起来你很有发言权。”\n\n"+
 "“大学四年，替他找过三次钱包，两次身份证，一次猫。”\n\n"+
 "“猫也能丢？”\n\n"+
 "“不是丢。他前任把猫抱走了，他喝多以后非说是失窃，让我陪他去报警。”\n\n"+
 other.name+"终于笑出来。“然后呢？”\n\n"+
 "“然后警察让他先醒酒。”\n\n"+
 "“你真陪他去了？”\n\n"+

 pov.name+"盯着他两秒，没忍住又笑了一下。外面"+k.sound+"。有人从走廊尽头喊了一声，却不是叫他们。"+extra+"\n\n"+

 other.name+"看着他，像是被气笑了。“刚聊了快四十分钟。”\n\n"+
 "“所以？”\n\n"+
 "“"+other.name+"。”\n\n"+

function specialLine(story){
 const a=story.people[0],b=story.people[1];
 return pick([
   "后来有一次，"+b.name+"临时把见面时间改晚了两个小时。"+a.name+"在聊天框里打了半天字，最后只回了一个“行”，然后把自己原来的安排往后挪。",
   a.name+"第一次去"+b.name+"住处时，发现自己的号码被单独设了铃声。"+b.name+"被问起，只说手机平时静音，怕漏掉急事。",
   "有一回朋友拿了"+a.name+"桌上的充电器，被他当场要了回来。半小时后"+b.name+"顺手拿走同一个，他看见了，只问晚上记得带回来。",
   b.name+"生病那次谁都没告诉。"+a.name+"是从一条只有两秒钟的语音里听出来的，当晚就去了他家。第二天朋友问起，他只说刚好顺路。"
 ]);
}

function buildStory(keepLocked){
 const g=chosenGenre(),roles=rolePlan(),old=current?current.people:[];
 const people=roles.map((role,i)=>buildPerson(role,i,g,keepLocked&&locked.has(i)?old[i]:null));
 const meeting=keepLocked&&current&&current.meeting?current.meeting:pick(dataForGenre(g).events);
 const s={id:current&&keepLocked?current.id:uid(),created:Date.now(),genre:g,mode:$("mode").value,ageGap:$("ageGap").value,heat:$("heat").value,people,meeting,locked:[],event:"",special:"",chapter:"",timeline:current&&keepLocked?(current.timeline||[]):[],rating:current&&keepLocked?current.rating:"",feedback:current&&keepLocked?current.feedback:"",favorite:current&&keepLocked?current.favorite:false};
 s.event=buildEvent(s);s.special=specialLine(s);s.chapter=buildChapter(s);return s;
}
function persistCurrent(){
 if(!current)return;
 let arr=load("storyloomStories",[]);const i=arr.findIndex(x=>x.id===current.id);
 if(i>=0)arr[i]=current;else arr.unshift(current);
 save("storyloomStories",arr.slice(0,40));
}
function renderStory(){
 if(!current)return;$("result").classList.remove("hidden");
 $("characters").innerHTML=current.people.map((p,i)=>'<div class="card"><div class="cardhead"><div><div class="role">'+p.role+' · '+p.identity+'</div><div class="name">'+p.name+'</div></div><button class="secondary lock '+(locked.has(i)?"on":"")+'" data-i="'+i+'">'+(locked.has(i)?"🔒 已锁定":"🔓 锁定")+'</button></div><div class="badges"><span>'+p.age+'岁</span><span>'+escapeHtml(p.trait)+'</span></div><div class="prose" style="margin-top:9px">'+escapeHtml(profileText(p))+'</div></div>').join("");
 document.querySelectorAll(".lock").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;locked.has(i)?locked.delete(i):locked.add(i);renderStory()});

 $("favorite").textContent=current.favorite?"♥ 已收藏":"♡ 收藏这组";

}

function renderTimeline(){
 const tl=current&&current.timeline||[];
 $("timeline").innerHTML=tl.length?tl.map((x,i)=>'<div class="timelineItem"><b>'+(i+1)+'. '+escapeHtml(x.title)+'</b><div class="muted" style="margin-top:4px">'+new Date(x.time).toLocaleDateString()+'</div><div class="prose" style="margin-top:6px">'+escapeHtml(x.text.slice(0,180))+(x.text.length>180?"…":"")+'</div></div>').join(""):'<div class="muted">喜欢的名场面可以钉在这里。中间没写的剧情完全可以留白。</div>';
}
function renderSceneChips(){$("sceneChips").innerHTML=SCENES.map(x=>'<button class="chip" data-scene="'+escapeHtml(x)+'">'+x+'</button>').join("");document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>showScene(b.dataset.scene))}
function showScene(type){currentScene={title:type,text:makeScene(type)};$("sceneText").textContent=currentScene.text;$("sceneOutput").classList.remove("hidden")}
function renderLibrary(favsOnly){
 const arr=load("storyloomStories",[]).filter(s=>!favsOnly||s.favorite);
 $("libraryList").innerHTML=arr.length?arr.map(s=>'<div class="libItem"><div class="libTop"><div><div class="libName">'+s.people.map(p=>p.name).join(" × ")+'</div><div class="libMeta">'+escapeHtml(s.genre)+' · '+(s.rating||"未评价")+(s.favorite?" · ♥ 收藏":"")+'</div></div><button class="secondary reopen" data-id="'+s.id+'">重温</button></div><div class="prose" style="margin-top:7px">'+escapeHtml((s.event||"").slice(0,140))+'…</div></div>').join(""):'<div class="empty">这里还空着。生成过的故事会自动保留最近 40 组。</div>';
 document.querySelectorAll(".reopen").forEach(b=>b.onclick=()=>{const s=load("storyloomStories",[]).find(x=>x.id===b.dataset.id);if(s){current=s;locked=new Set();switchTab("create");renderStory();$("result").scrollIntoView({behavior:"smooth"})}});
}
function switchTab(which){
 const create=which==="create";$("createView").classList.toggle("hidden",!create);$("libraryView").classList.toggle("hidden",create);$("tabCreate").classList.toggle("active",create);$("tabLibrary").classList.toggle("active",!create);if(!create)renderLibrary();
}

$("saveGenre").onclick=()=>{const v=$("customGenre").value.trim();if(!v)return;let a=load("storyloomCustomGenres",[]);if(!a.includes(v)){a.push(v);save("storyloomCustomGenres",a)}renderGenreOptions();$("genre").value=v;$("customGenre").value="";toast("题材已保存")};
$("mode").onchange=updateModeUI;$("surprise").oninput=()=>$("surpriseText").textContent=$("surprise").value;
$("generate").onclick=()=>{rememberPersona();locked=new Set();current=buildStory(false);persistCurrent();renderStory();setTimeout(()=>$("result").scrollIntoView({behavior:"smooth"}),80)};
$("rerollUnlocked").onclick=()=>{if(!current)return;current=buildStory(true);persistCurrent();renderStory()};
$("rerollRelation").onclick=()=>{if(!current)return;current.meeting=pick(dataForGenre(current.genre).events);current.event=buildEvent(current);current.special=specialLine(current);current.chapter=buildChapter(current);persistCurrent();renderStory()};
$("rewriteChapter").onclick=()=>{if(!current)return;current.chapter=buildChapter(current,rand(0,FIRST_LINES.length-1));persistCurrent();renderStory();toast("第一章换了一种写法")};
document.querySelectorAll(".rate").forEach(b=>b.onclick=()=>{selectedRating=b.dataset.rating;current.rating=selectedRating;renderRating();persistCurrent()});
$("saveFeedback").onclick=()=>{if(!current)return;current.rating=selectedRating;current.feedback=$("feedback").value.trim();persistCurrent();toast("评价已经记住了")};
$("favorite").onclick=()=>{if(!current)return;current.favorite=!current.favorite;persistCurrent();renderStory();toast(current.favorite?"已收藏":"已取消收藏")};
$("makeCustomScene").onclick=()=>{const v=$("customScene").value.trim();if(v)showScene(v)};
$("addTimeline").onclick=()=>{if(!current||!currentScene)return;current.timeline=current.timeline||[];current.timeline.push({title:currentScene.title,text:currentScene.text,time:Date.now()});persistCurrent();renderTimeline();toast("已经钉进时间线")};
$("copyScene").onclick=async()=>{if(!currentScene)return;try{await navigator.clipboard.writeText(currentScene.text);toast("这一幕已复制")}catch{}};
$("copyStory").onclick=async()=>{if(!current)return;const t="Storyloom 故事设定\n题材："+current.genre+"\n人物：\n"+current.people.map(p=>p.role+"｜"+profileText(p)).join("\n")+"\n\n相识："+current.event+"\n特殊性："+current.special+"\n\n第一章：\n"+current.chapter+"\n\n正文规则：固定单一人物视角，不写站在故事外面的关系点评；能让读者从动作、物件、对话看出来的内容，不再替读者总结。情绪必须落在具体事件和细节上。对话要真正展开，允许十几轮甚至更多来回、岔题、打断、旧事和答非所问；冷淡不等于只说两三个字，强势也不等于句句命令。少用挑眉、勾唇、眸色一沉、指尖收紧、沉默片刻等库存动作。人物背景要影响他的选择和说话方式。每一章至少发生一件具体的事，并让关系在一个可见的小地方发生变化。允许人物嘴硬、误会、迁怒和不体面，不要把所有人写得过分会沟通。";try{await navigator.clipboard.writeText(t);toast("整组设定已复制")}catch{}};
$("tabCreate").onclick=()=>switchTab("create");$("tabLibrary").onclick=()=>switchTab("library");
$("showFav").onclick=()=>renderLibrary(true);
$("exportFeedback").onclick=async()=>{const arr=load("storyloomStories",[]).filter(s=>s.rating||s.feedback).slice(0,20);const t="这是我最近在 Storyloom 里对故事的反馈，请帮我分析我的小说审美，并用于以后创作：\n\n"+arr.map((s,i)=>(i+1)+". "+s.genre+"｜"+s.people.map(p=>p.role+p.name+"("+p.trait+")").join("；")+"｜评分："+(s.rating||"未评分")+"｜意见："+(s.feedback||"无")).join("\n");try{await navigator.clipboard.writeText(t);toast("近期反馈已复制")}catch{}};

renderGenreOptions();renderDatalists();renderSceneChips();updateModeUI();renderLibrary();
</script>
