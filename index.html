<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Storyloom</title>
<style>
:root{--bg:#0d0f14;--panel:#171a22;--panel2:#202431;--line:#303746;--text:#f6f7fb;--muted:#a8afbd;--p1:#9b8cff;--p2:#ff9bc8;--good:#79d7a6;--warn:#f2c675;--bad:#ee8f9b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0f14,#141824 55%,#0d0f14);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}.wrap{max-width:840px;margin:auto;padding:18px 14px 60px}
.hero{padding:22px 18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(155,140,255,.18),rgba(255,155,200,.09))}
.brand{font-size:30px;font-weight:900}.tagline{margin-top:7px;color:#d0d5df;font-size:14px;line-height:1.72}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.tab{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-weight:750}.tab.active{background:linear-gradient(135deg,rgba(155,140,255,.25),rgba(255,155,200,.15));border-color:#6f6899}
.panel{margin-top:13px;background:rgba(23,26,34,.96);border:1px solid var(--line);border-radius:19px;padding:15px}.muted{color:var(--muted);font-size:12px;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text)}.field textarea{min-height:100px;resize:vertical}
.inline{display:flex;gap:8px}.inline input{flex:1}.mini{padding:0 13px;border-radius:12px;border:1px solid var(--line);background:#292e3b;color:var(--text);font-weight:700}
.big{width:100%;margin-top:12px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#111319;font-size:17px;font-weight:900}
.secondary{padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);font-weight:720}
details summary{cursor:pointer;font-weight:750}.settings{margin-top:12px;display:grid;gap:11px}
.card{margin-top:10px;padding:15px;border:1px solid var(--line);border-radius:17px;background:#12151c}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.role{font-size:12px;color:var(--p1);font-weight:800}.name{font-size:22px;font-weight:900;margin-top:3px}
.badges span{display:inline-block;padding:5px 8px;border-radius:999px;background:#272c39;color:#dce0e8;font-size:12px;margin:5px 3px 0 0}.prose{font-size:14px;line-height:1.92;color:#e7e9ef;white-space:pre-wrap}
.sectionTitle{font-size:13px;color:#c2c7d1;font-weight:800;margin-bottom:8px}.chapter{padding:15px;background:#11141b;border-radius:15px;border:1px solid #282e3b}
.outline{display:grid;gap:9px}.beat{padding:12px 13px;border-left:3px solid var(--p1);background:#1b1f29;border-radius:11px}.beat b{display:block;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.lock.on{border-color:var(--p2);color:#ffd9e9}.hidden{display:none!important}
.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rate{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}.rate.on.good{border-color:var(--good)}.rate.on.mid{border-color:var(--warn)}.rate.on.bad{border-color:var(--bad)}
.sceneChips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:9px 11px;border-radius:999px;border:1px solid var(--line);background:#242936;color:#eef0f5;font-size:13px}
.timelineItem{padding:11px 0;border-top:1px dashed var(--line)}.timelineItem:first-child{border-top:0}.libItem{padding:13px;border:1px solid var(--line);border-radius:14px;background:#12151c;margin-top:9px}.libTop{display:flex;justify-content:space-between;gap:8px}.libName{font-weight:850}.libMeta{font-size:12px;color:var(--muted);margin-top:4px}.empty{text-align:center;padding:25px;color:var(--muted)}
.rangeRow{display:flex;align-items:center;gap:10px}.rangeRow input{flex:1}.note{padding:10px 12px;background:#1e2230;border-radius:12px;color:#cbd0dc;font-size:12px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#262b38;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:13px;display:none;z-index:20}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="brand">Storyloom</div>
<div class="tagline">题材先决定世界，人设和职业必须对得上；有脑洞就把它当硬设定。Storyloom 再负责把人物、大纲、第一章和名场面接起来。</div>
</section>

<div class="tabs">
<button class="tab active" id="tabCreate">🪡 捏一个故事</button>
<button class="tab" id="tabLibrary">📚 我的故事库</button>
</div>

<div id="createView">
<section class="panel">
<details open>
<summary>⚙️ 故事设置</summary>
<div class="settings">

<div class="grid2">
<div class="field"><label>题材 / 世界</label><select id="genre"></select></div>
<div class="field"><label>关系模式</label><select id="mode"><option value="1v1">1v1</option><option value="multiA">1受 × 多攻</option><option value="multiR">1攻 × 多受</option></select></div>
</div>

<div class="grid2">
<div class="field">
<label>新增自己的题材</label>
<div class="inline"><input id="customGenre" placeholder="例如：民国戏班 / 港风豪门"><button class="mini" id="saveGenre">保存</button></div>
</div>
<div class="field" id="countField"><label>多人模式人数</label><select id="multiCount"><option value="2">2个</option><option value="3" selected>3个</option><option value="4">4个</option><option value="5">5个</option><option value="6">6个</option><option value="7">7个</option><option value="8">8个</option></select></div>
</div>

<div class="field">
<label>自定义题材的世界观补充（可选，保存后跟着题材走）</label>
<textarea id="worldNote" placeholder="例如：塔制哨向世界，有等级、精神体、精神链接和固定搭档制度。"></textarea>
</div>

<div class="grid2">
<div class="field"><label>攻身份 / 职业（留空则按题材生成）</label><input id="atkIdentity" placeholder="例如：金主 / 投资人 / S级哨兵"></div>
<div class="field"><label>受身份 / 职业（留空则按题材生成）</label><input id="recIdentity" placeholder="例如：演员 / 向导 / 法学生"></div>
</div>

<div class="grid2">
<div class="field"><label>攻性格 / 人设（可留空随机）</label><input id="atkPersona" placeholder="例如：前期冷漠、自负、控制欲强"></div>
<div class="field"><label>受性格 / 人设（可留空随机）</label><input id="recPersona" placeholder="例如：清醒、冷淡、边界很硬"></div>
</div>

<div class="grid2">
<div class="field"><label>年龄差</label><select id="ageGap"><option>随机</option><option>同龄 / ±1</option><option>攻年上 2–5 岁</option><option>攻年上 6–10 岁</option><option>受年上 2–5 岁</option></select></div>
<div class="field"><label>关系气质</label><select id="heat"><option>随机</option><option>慢热暗流</option><option>高张力</option><option>危险拉扯</option><option>势均力敌</option><option>轻松暧昧</option></select></div>
</div>

<div class="field">
<label>我已经有一个脑洞 / 定制情节（可留空）</label>
<textarea id="customPlot" placeholder="直接像聊天一样写。比如：娱乐圈文，受是演员，攻是前期冷漠的金主，只把受当情人；后来发现受也不在意他，只当工作，攻愤怒分手，真正分开后开始追妻。"></textarea>
<div class="muted" style="margin-top:6px">这里的内容优先级最高。你写了“受是演员”“攻是金主”，生成结果就按这个走。</div>
</div>

<div class="field">
<label>惊喜度：<span id="surpriseText">60</span>%</label>
<div class="rangeRow"><span class="muted">熟悉口味</span><input type="range" id="surprise" min="0" max="100" value="60"><span class="muted">给我惊喜</span></div>
</div>

<div class="note"><b>正文规则已内置：</b>固定人物视角；少写“他们都知道 / 气氛微妙 / 他其实已经动心”这类关系点评；对话要真正聊起来，避免“你什么意思？—没什么意思。—确定？”这种空转；冷淡不等于只说两三个字。</div>
</div>
</details>
<button class="big" id="generate">✨ 给我一个故事</button>
</section>

<section id="result" class="hidden">
<div class="panel">
<div class="sectionTitle">人物</div>
<div id="characters"></div>
<div class="actions"><button class="secondary" id="rerollUnlocked">🎲 只重抽没锁的人</button><button class="secondary" id="rerollOutline">🧭 人物不动，只换大纲</button></div>
</div>

<div class="panel">
<div class="sectionTitle">故事大纲</div>
<div id="outline" class="outline"></div>
</div>

<div class="panel">
<div class="sectionTitle">第一章</div>
<div class="chapter prose" id="chapterText"></div>
<div class="actions"><button class="secondary" id="rewriteChapter">✍️ 换一种第一章写法</button><button class="secondary" id="copyStory">📋 复制整组设定</button></div>
</div>

<div class="panel">
<div class="sectionTitle">这组你吃不吃？</div>
<div class="rating"><button class="rate good" data-rating="满意">😍 满意</button><button class="rate mid" data-rating="一般">😐 一般</button><button class="rate bad" data-rating="不满意">😖 不满意</button></div>
<div class="field" style="margin-top:10px"><textarea id="feedback" placeholder="哪里香、哪里怪、哪句像AI、职业不对、冲突很好……"></textarea></div>
<div class="actions"><button class="secondary" id="saveFeedback">保存评价</button><button class="secondary" id="favorite">♡ 收藏这组</button></div>
</div>

<div class="panel">
<div class="sectionTitle">名场面点播机</div>
<div class="sceneChips" id="sceneChips"></div>
<div class="field" style="margin-top:10px"><div class="inline"><input id="customScene" placeholder="自己写：发现受只当工作 / 愤怒分手 / 第一次追妻失败"><button class="mini" id="makeCustomScene">写这一幕</button></div></div>
<div id="sceneOutput" class="hidden" style="margin-top:11px"><div class="chapter prose" id="sceneText"></div><div class="actions"><button class="secondary" id="addTimeline">📌 加入时间线</button><button class="secondary" id="copyScene">📋 复制这一幕</button></div></div>
</div>

<div class="panel"><div class="sectionTitle">时间线</div><div id="timeline"></div></div>
</section>
</div>

<div id="libraryView" class="hidden">
<section class="panel">
<div class="sectionTitle">我的故事库</div>
<div class="actions"><button class="secondary" id="showFav">❤️ 只看收藏</button><button class="secondary" id="exportFeedback">📦 复制近期反馈给 ChatGPT</button></div>
<div id="libraryList"></div>
</section>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const toast=t=>{const x=$("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1700)};

const GENRES={
"大学校园":{atk:["法学院学生","建筑系学生","医学院学生","校辩论队主力","研究生"],rec:["法学院学生","新闻系学生","美术系学生","研究生","学生会干部"],hooks:["社团活动临时收尾","凌晨自习室停电","共同朋友生日局","跨院比赛临时组队"]},
"都市职场":{atk:["青年律师","投资经理","建筑师","创业公司合伙人","品牌主理人"],rec:["记者","设计师","策划","摄影师","青年律师"],hooks:["同一个项目出了临时事故","航班延误","共同客户突然失联","一场加班后的饭局"]},
"娱乐圈":{atk:["影视投资人","经纪公司老板","制片人","导演","演员"],rec:["演员","唱作人","编剧","摄影师","时尚编辑"],hooks:["同一部戏正式开机","一次品牌晚宴","临时补拍","颁奖礼后台","深夜收工"]},
"高干 / 家族":{atk:["家族企业继承人","投资人","青年律师","建筑事务所合伙人","基金经理"],rec:["品牌主理人","律师","大学教师","记者","艺术从业者"],hooks:["长辈饭局","共同朋友婚礼","旧宅产权纠纷","慈善晚宴"]},
"悬疑危险":{atk:["刑侦顾问","安保顾问","律师","调查记者","私人调查员"],rec:["记者","法医","律师","摄影师","私人调查员"],hooks:["共同朋友失联","医院认领同一个伤者","一份拿错的文件袋","旧城区追同一条线索"]},
"电竞":{atk:["职业选手","教练","战队经理","游戏主播","数据分析师"],rec:["职业选手","赛事解说","游戏策划","数据分析师","青训选手"],hooks:["线下赛后台拿错外设","排位赛吵了一整局","临时表演赛缺人","直播事故"]},
"刑侦":{atk:["刑警","检察官","律师","技侦人员","法医"],rec:["法医","记者","律师","心理顾问","私人调查员"],hooks:["同一案件现场","凌晨审讯结束","关键证人醒来前","卷宗送错"]},
"竹马 / 发小":{atk:["青年律师","医生","建筑师","创业者","教师"],rec:["研究生","摄影师","教师","设计师","演员"],hooks:["多年后共同朋友婚礼","春节回老家","旧房搬家","高中同学聚会"]},
"破镜重圆开局":{atk:["青年律师","医生","投资人","演员","建筑师"],rec:["演员","记者","摄影师","教师","设计师"],hooks:["分开三年后婚礼重逢","公司项目再合作","机场延误","急诊室重逢"]},
"古代架空":{atk:["年轻将领","世家公子","御史","商行少东家","暗卫统领"],rec:["太医","书院先生","画师","世家公子","商行掌柜"],hooks:["上元灯会","雨夜废寺","一桩旧案","宫宴散场"]},
"轻幻想":{atk:["异常调查员","特殊事务律师","研究员","秘密组织联络人"],rec:["梦境记录师","古籍修复师","研究员","灵感摄影师"],hooks:["重复做了同一个梦","只对他们开放的地铁站","一件重复出现的旧物","一次异常事件"]},
"哨向":{atk:["S级哨兵·特勤行动队","A级哨兵·边境作战组","哨兵教官","自由哨兵"],rec:["S级向导·精神疏导科","A级向导·中央塔","向导医师","自由向导"],hooks:["任务后紧急精神疏导","匹配测试意外高契合","一次精神失控事件","临时搭档任务"],world:"塔制哨向世界。哨兵拥有强化感官并可能出现感官过载，向导可进行精神疏导；存在等级、精神体、精神链接和搭档制度。"},
"ABO":{atk:["Alpha投资人","Alpha医生","Alpha律师","Alpha演员"],rec:["Omega演员","Omega设计师","Beta记者","Omega研究生"],hooks:["抑制剂失效后的意外相遇","合作项目","共同朋友聚会","临时标记事故"],world:"ABO世界，有Alpha/Beta/Omega第二性别、信息素与抑制剂等设定。"},
"无限流":{atk:["资深玩家","副本调查员","积分榜高位玩家","新人玩家"],rec:["新人玩家","资深玩家","情报贩子","副本NPC异常者"],hooks:["第一次进入同一副本","必须两人合作的规则","安全屋只剩一个名额","共同触发隐藏任务"],world:"无限流副本世界，存在规则、任务、积分与生存条件。"}
};
const ATK_TRAITS=["控场感强，习惯先处理问题再谈情绪","表面温和，真正做决定时很难被改变","很少示弱，对失控尤其敏感","嘴上不留情，做事却比说话可靠","自负，习惯别人适应自己的节奏","看似散漫，实际对边界和秩序要求很高"];
const REC_TRAITS=["清醒，很少把希望压在别人身上","冷淡，熟了以后反而话不少","敏感但不轻易示弱，判断人很快","看起来好说话，真正的边界却很硬","有点阴郁，情绪不外露但记性很好","懒得解释自己，遇到重要的事反而非常固执"];
const FAMILIES=["父母常年异地工作，他从高中起就习惯自己安排生活","家里做生意，物质宽裕，很多决定却从小有人替他安排","父母早年分开，他和其中一方联系一直很淡","普通工薪家庭，家里关系稳定，他反而很早就想搬出去自己住","跟外婆长大，成年后才慢慢和父母恢复来往","家里兄弟姐妹多，他很早就学会自己解决麻烦"];
const HABITS=["手机常年静音，但会给少数联系人单独开提醒","不吃早餐，下午却一定会买一杯固定口味的咖啡","记性很好，别人随口说过的小事隔几个月还能翻出来","桌面看着乱，别人动过什么他一眼就能看出来","生气时语速会变慢，越不耐烦反而越客气","睡得很浅，凌晨的消息几乎都能看到"];
const FLAWS=["知道自己不占理时也很难第一时间道歉","关系一旦让他觉得失控，就会先把人推开","太相信自己的判断，常常把别人的解释听成借口","不擅长求助，事情拖到很糟才会让别人知道","对真正亲近的人要求反而更高","很会记旧账，只是平时不说"];
const SPIRITS=["黑豹","雪豹","苍鹰","灰狼","雪鸮","赤狐","白鹿","虎鲸","渡鸦","黑曼巴"];
const DEFAULT_SCENES=["第一次心动","吃醋","暧昧失控","第一次接吻","告白","确认关系","争吵","冷战","分手","久别重逢","破镜重圆","第一次低头","朋友面前露馅","凌晨四点的一通电话","多年以后"];
let current=null,locked=new Set(),selectedRating="",currentScene=null;

function customRecords(){
 const r=load("storyloomCustomGenreRecords",[]);
 const legacy=load("storyloomCustomGenres",[]);
 const out=Array.isArray(r)?r:[];
 if(Array.isArray(legacy))legacy.forEach(x=>{if(typeof x==="string"&&!out.some(y=>y.name===x))out.push({name:x,world:""})});
 return out;
}
function allGenres(){return [...Object.keys(GENRES),...customRecords().map(x=>x.name).filter(x=>!GENRES[x])]}
function renderGenres(){
 const prev=$("genre").value;
 $("genre").innerHTML='<option>随机</option>'+allGenres().map(x=>'<option>'+esc(x)+'</option>').join("");
 if([...$("genre").options].some(o=>o.value===prev))$("genre").value=prev;
 syncWorld();
}
function syncWorld(){
 const g=$("genre").value;
 if(GENRES[g]?.world){$("worldNote").value=GENRES[g].world;$("worldNote").disabled=true}
 else{$("worldNote").disabled=false;const r=customRecords().find(x=>x.name===g);$("worldNote").value=r?.world||""}
}

  a.name+"把便利贴推回去。“在你这里，这半年就剩一个‘结清’？”\n\n"+
  b.name+"明显愣了一下。\n\n"+
  "“不然呢？”他说，“你以前也没说过还有别的。”";
 }
 if(type==="愤怒分手"){
  return "真正把“结束”两个字说出来的人是"+a.name+"。\n\n"+
  "那天"+b.name+"拍夜戏回来，鞋还没换完，就听见他说：“以后不用过来了。”\n\n"+
  b.name+"手还扶着鞋柜。“从什么时候开始？”\n\n"+
  "“什么？”\n\n"+
  "“结束。今天算，还是这个月底算？”\n\n"+
  a.name+"原本等的根本不是这个问题。\n\n"+
  "“你就只想问这个？”\n\n"+
  "“不然还要问什么？”"+b.name+"站直，把钥匙从口袋里拿出来，“公寓是你的，我东西这两天会搬走。剧组那边的投资跟我们私人关系分开吧，合同已经签了。”\n\n"+
  a.name+"看着那串钥匙，火气一下顶上来。“你是不是早就等着这一天？”\n\n"+
  b.name+"皱了皱眉。“我为什么要等？”\n\n"+
  "“因为你根本不在意。”\n\n"+
  "“你现在才发现？”\n\n"+
  "房间里安静了几秒。\n\n"+
  b.name+"像是觉得这句话太重，又补了一句：“我的意思是，我们一开始说好的就是这样。你不要恋爱，不要我管你，也不需要我有什么承诺。我照做了。现在你要结束，我也照做。”\n\n"+
  a.name+"脸色一点点沉下来。“行。”\n\n"+
  "“那我明天下午来收东西。”\n\n"+
  "“不用。”\n\n"+
  "“为什么？”\n\n"+
  "“我让人给你送过去。”\n\n"+
  b.name+"看了他一眼，最后只说：“也行。”\n\n"+
  "第二天下午四点，所有东西真的被送到了酒店。连他忘在浴室的一把旧梳子都装在最上面。";
 }
 if(type==="第一次追妻失败"){
  return a.name+"第一次主动去片场找"+b.name+"，提前两个小时让人订了餐车。\n\n"+
  "工作人员都以为是品牌送的，直到助理把卡片递给"+b.name+"。\n\n"+
  b.name+"看完，问：“谁送的？”\n\n"+
  "“A总那边。”\n\n"+
  "“哦。”\n\n"+
  "助理等了一会儿。“没了？”\n\n"+
  "“不然呢？”\n\n"+
  "晚上收工，"+a.name+"的车还停在外面。"+b.name+"走过去敲了敲车窗。\n\n"+
  a.name+"降下玻璃。“上车，我送你。”\n\n"+
  "“不用，剧组有车。”\n\n"+
  "“我等了你三个小时。”\n\n"+
  b.name+"点头。“那挺辛苦的。”\n\n"+
  a.name+"被这句堵得差点笑出来。“你故意的？”\n\n"+
  "“没有。我只是没让你等。”\n\n"+
  "“吃的你也没动。”\n\n"+
  "“我今天要拍近景，不能吃那么咸。”\n\n"+
  "“以前你最爱那家。”\n\n"+
  "“以前也不是天天吃。”\n\n"+
  a.name+"看着他，第一次发现自己以前记住的那些东西，原来根本不足以换一张重新开始的门票。\n\n"+
  b.name+"把口罩往上拉了拉。“还有事吗？没事我走了，明天五点起。”\n\n"+
  a.name+"终于问：“那我应该怎么做？”\n\n"+
  b.name+"停了一下。\n\n"+
  "“我不知道。”他说，“你以前没问过我这个。”";
 }
 if(type==="攻第一次低头"){
  return "那天没有礼物，也没有资源置换。\n\n"+
  a.name+"在"+b.name+"酒店楼下等了一个多小时，只发了一条消息：有空下来十分钟，我想跟你道歉。\n\n"+
  b.name+"下来以后没有上车，隔着半开的车窗问：“说吧。”\n\n"+
  a.name+"第一次没从“我当时为什么那样做”开始解释。\n\n"+
  "“那天是我故意说结束的。”\n\n"+
  b.name+"没说话。\n\n"+
  "“我以为你会拦一下。你没拦，我就更生气。”\n\n"+
  "“所以呢？”\n\n"+
  "“所以很难看。”"+a.name+"说，“我明知道我们一开始怎么约定的，后来自己变了，又因为你没跟着一起变就发火。这个是我的问题。”\n\n"+
  b.name+"站在路灯下面，听完才问：“你现在说这些，是想让我回去？”\n\n"+
  "“想。”\n\n"+
  "“那我不回呢？”\n\n"+
  a.name+"停了停。“那就不回。我还能继续追。”\n\n"+
  b.name+"终于笑了一下。“你现在倒挺会给自己安排工作。”\n\n"+
  "“学你的。”\n\n"+
  "“别。我工作效率比你高。”";
 }
 if(type==="分手")return makeScene("愤怒分手");
 if(type==="破镜重圆"){
  return "重逢以后第三次见面，他们终于没再聊工作。\n\n"+b.name+"把菜单合上，问：“你今天到底为什么约我？”\n\n"+
  a.name+"没有再绕。“想见你。”\n\n"+
  "“上次你说是谈项目。”\n\n"+
  "“那次也想见你，只是顺便谈项目。”\n\n"+
  "“你现在说话越来越不讲究体面了。”\n\n"+
  "“以前太讲究，结果更难看。”\n\n"+
  b.name+"低头笑了一下，没有马上给答案。服务员来加水，他们等人走了以后，又把话题接了回去。\n\n"+
  "这一次谁都没急着把关系定成什么，至少先把以前没说过的话一件件说完。";
 }
 const place=pick(["停车场出口","酒店走廊","楼下便利店","深夜空着的客厅"]);
 return place+"里只剩他们两个人。\n\n"+b.name+"先把手里的东西放下：“你今天找我，不会只是为了这件事吧？”\n\n"+
 a.name+"靠在桌边，没有立刻回答。“为什么这么想？”\n\n"+
 "“因为这件事三句话能说完。你已经绕了半小时。”\n\n"+
 "“我是在想怎么说。”\n\n"+
 "“那你慢慢想。我明早还有工作，最多给你二十分钟。”\n\n"+
 a.name+"笑了下。“你现在跟我说话都开始计时了？”\n\n"+
 "“对你比较有效。”\n\n"+
 "他们后来真的聊了二十多分钟。话题从眼前的事绕到前几天没回的一条消息，又绕到一次谁都没提过的旧争执。每句话都落在具体的事情上，没有谁用“你什么意思”“没什么意思”把谈话糊弄过去。"
}
function showScene(type){currentScene={title:type,text:makeScene(type)};$("sceneText").textContent=currentScene.text;$("sceneOutput").classList.remove("hidden")}
function renderTimeline(){
 const tl=current?.timeline||[];$("timeline").innerHTML=tl.length?tl.map((x,i)=>'<div class="timelineItem"><b>'+(i+1)+'. '+esc(x.title)+'</b><div class="muted" style="margin-top:4px">'+new Date(x.time).toLocaleDateString()+'</div><div class="prose" style="margin-top:6px">'+esc(x.text.slice(0,200))+(x.text.length>200?"…":"")+'</div></div>').join(""):'<div class="muted">喜欢的名场面可以钉在这里。中间没写的剧情完全可以留白。</div>'
}
function renderLibrary(fav){
 const arr=load("storyloomStories",[]).filter(s=>!fav||s.favorite);
 $("libraryList").innerHTML=arr.length?arr.map(s=>'<div class="libItem"><div class="libTop"><div><div class="libName">'+s.people.map(p=>p.name).join(" × ")+'</div><div class="libMeta">'+esc(s.genre)+' · '+(s.rating||"未评价")+(s.favorite?" · ♥ 收藏":"")+'</div></div><button class="secondary reopen" data-id="'+s.id+'">重温</button></div><div class="prose" style="margin-top:7px">'+esc((s.outline?.[0]?.[1]||"").slice(0,150))+'…</div></div>').join(""):'<div class="empty">这里还空着。生成过的故事会自动保留最近 50 组。</div>';
 document.querySelectorAll(".reopen").forEach(b=>b.onclick=()=>{const s=load("storyloomStories",[]).find(x=>x.id===b.dataset.id);if(s){current=s;locked=new Set();switchTab("create");renderStory();$("result").scrollIntoView({behavior:"smooth"})}})
}
function switchTab(w){
 const c=w==="create";$("createView").classList.toggle("hidden",!c);$("libraryView").classList.toggle("hidden",c);$("tabCreate").classList.toggle("active",c);$("tabLibrary").classList.toggle("active",!c);if(!c)renderLibrary()
}
function writingRules(){
 return "正文写作规则：固定人物视角；少写站在故事外面的关系点评，避免“他们都知道”“气氛微妙”“他其实已经动心”等替读者下结论的句子。情绪要落在具体事件、物件、动作和前后呼应的细节上。对话要真正展开，允许十几轮以上的来回、岔题、打断、旧事和答非所问，但每轮都要推动信息或关系。禁止用“你什么意思？—没什么意思。—确定？”“所以？—没什么。”这种空转短句假装有张力。冷淡不等于话少，强势不等于句句命令。少用挑眉、勾唇、眸色一沉、指尖收紧、沉默片刻等库存动作。人物背景要影响选择和说话方式。允许人物嘴硬、误会、迁怒和不体面。"
}

$("saveGenre").onclick=()=>{
 const name=$("customGenre").value.trim();if(!name)return;
 let arr=customRecords(),i=arr.findIndex(x=>x.name===name),world=$("worldNote").value.trim();
 if(i>=0)arr[i].world=world;else arr.push({name,world});
 save("storyloomCustomGenreRecords",arr);renderGenres();$("genre").value=name;$("customGenre").value="";syncWorld();toast("题材已保存")
};
$("genre").onchange=syncWorld;$("mode").onchange=updateModeUI;$("surprise").oninput=()=>$("surpriseText").textContent=$("surprise").value;
$("generate").onclick=()=>{locked=new Set();current=buildStory(false);persist();renderStory();setTimeout(()=>$("result").scrollIntoView({behavior:"smooth"}),80)};
$("rerollUnlocked").onclick=()=>{if(!current)return;current=buildStory(true);persist();renderStory()};
$("rerollOutline").onclick=()=>{if(!current)return;current.outline=buildOutline(current);current.chapter=buildChapter(current,rand(0,9));persist();renderStory()};
$("rewriteChapter").onclick=()=>{if(!current)return;current.chapter=buildChapter(current,rand(0,9));persist();renderStory();toast("第一章已换一种写法")};
document.querySelectorAll(".rate").forEach(b=>b.onclick=()=>{selectedRating=b.dataset.rating;current.rating=selectedRating;renderRating();persist()});
$("saveFeedback").onclick=()=>{if(!current)return;current.rating=selectedRating;current.feedback=$("feedback").value.trim();persist();toast("评价已经记住了")};
$("favorite").onclick=()=>{if(!current)return;current.favorite=!current.favorite;persist();renderStory();toast(current.favorite?"已收藏":"已取消收藏")};
$("makeCustomScene").onclick=()=>{const v=$("customScene").value.trim();if(v)showScene(v)};
$("addTimeline").onclick=()=>{if(!current||!currentScene)return;current.timeline=current.timeline||[];current.timeline.push({title:currentScene.title,text:currentScene.text,time:Date.now()});persist();renderTimeline();toast("已经钉进时间线")};
$("copyScene").onclick=async()=>{if(!currentScene)return;try{await navigator.clipboard.writeText(currentScene.text);toast("这一幕已复制")}catch{}};
$("copyStory").onclick=async()=>{
 if(!current)return;
 const t="Storyloom 故事设定\n题材："+current.genre+"\n世界观："+(current.world||"无额外设定")+"\n定制情节："+(current.customPlot||"无")+"\n\n人物：\n"+current.people.map(p=>p.role+"｜"+p.name+"｜"+p.identity+"｜"+p.age+"岁｜"+p.trait+"｜"+profileText(p,current.genre)).join("\n")+"\n\n故事大纲：\n"+current.outline.map((x,i)=>(i+1)+". "+x[0]+"："+x[1]).join("\n")+"\n\n第一章：\n"+current.chapter+"\n\n"+writingRules();
 try{await navigator.clipboard.writeText(t);toast("整组设定已复制")}catch{}
};
$("tabCreate").onclick=()=>switchTab("create");$("tabLibrary").onclick=()=>switchTab("library");$("showFav").onclick=()=>renderLibrary(true);
$("exportFeedback").onclick=async()=>{
 const arr=load("storyloomStories",[]).filter(s=>s.rating||s.feedback).slice(0,20);
 const t="这是我最近在 Storyloom 的反馈，请据此分析我的小说审美：\n\n"+arr.map((s,i)=>(i+1)+". "+s.genre+"｜"+s.people.map(p=>p.role+p.name+"("+p.identity+" / "+p.trait+")").join("；")+"｜评分："+(s.rating||"未评分")+"｜意见："+(s.feedback||"无")).join("\n");
 try{await navigator.clipboard.writeText(t);toast("近期反馈已复制")}catch{}
};

renderGenres();updateModeUI();renderLibrary();renderSceneChips();
</script>
</body>
